name: Publish verified Fragment 1.3.17
on:
  push:
    branches: [publish-verified-1.3.17]
    paths: [.github/workflows/publish-verified-fragment-1.3.17.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: fragment-verified-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abf3637b6f5a84de605766d6dedb984f87038814
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ff04905680f15d091f8c3786b05dc3da5f076601
          path: staged
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 1
      - name: Verify tested APK and prepare release files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,subprocess,urllib.request,zipfile
          source=Path('source');stage=Path('staged');target=Path('public');version='1.3.17'
          expected='a4ef8219ea1c60e5f5feb3ba5b430bdab8d9eb2fe352457857ee5ab1695889a6'
          apk=Path('verified.apk')
          urllib.request.urlretrieve('https://raw.githubusercontent.com/nicolenkoe/android-app-qa/ffbdc1d86c0cec4cf3f055150a2f781265269493/fragment.apk',apk)
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected,'Tested APK hash mismatch'
          manifest=json.loads((stage/'downloads/1.3.17/update.json').read_text())
          assert manifest['sha256']==expected and manifest['size']==apk.stat().st_size and manifest['versionCode']==25
          release=json.loads((source/'dist/versions.json').read_text())['releases'][0]
          assert release['version']==version and release['versionCode']==25
          count=0
          with zipfile.ZipFile(apk) as package:
              for path in (source/'dist').rglob('*'):
                  if not path.is_file() or 'downloads' in path.relative_to(source/'dist').parts:continue
                  name=str(path.relative_to(source/'dist'));data=path.read_bytes()
                  assert package.read('assets/www/'+name)==data,'APK/web mismatch: '+name
                  output=target/name;output.parent.mkdir(parents=True,exist_ok=True);output.write_bytes(data);count+=1
          parts=json.loads((stage/'.release-parts/manifest.json').read_text())
          for item in parts:
              output=stage/item['path'];assert output.resolve().is_relative_to(stage.resolve())
              output.parent.mkdir(parents=True,exist_ok=True)
              with output.open('wb') as stream:
                  for name in item['parts']:
                      chunk=stage/name;assert chunk.resolve().is_relative_to(stage.resolve());stream.write(chunk.read_bytes())
              assert output.stat().st_size==item['size'] and hashlib.sha256(output.read_bytes()).hexdigest()==item['sha256'],'Media piece mismatch'
          for path in stage.rglob('*'):
              if not path.is_file() or any(part in path.relative_to(stage).parts for part in ['.git','.release-parts']):continue
              name=path.relative_to(stage);output=target/name;output.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(path,output)
          folder=target/'downloads'/version;folder.mkdir(exist_ok=True)
          output=folder/('fragment-editor-'+version+'.apk')
          if output.exists():assert hashlib.sha256(output.read_bytes()).hexdigest()==expected,'Immutable APK already differs'
          shutil.copy2(apk,output);shutil.copy2(apk,target/'downloads/fragment-editor.apk')
          archive=folder/('fragment-source-'+version+'.zip')
          if not archive.exists():
              with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zipped:
                  for name in subprocess.check_output(['git','ls-files'],cwd=source,text=True).splitlines():
                      path=source/name
                      if path.is_file():zipped.write(path,'fragment-logo-editor-'+version+'/'+name)
          shutil.copy2(archive,target/'downloads/fragment-source.zip')
          with zipfile.ZipFile(archive) as zipped:
              for path in (source/'dist').rglob('*'):
                  if path.is_file() and 'downloads' not in path.relative_to(source/'dist').parts:assert zipped.read('fragment-logo-editor-'+version+'/dist/'+str(path.relative_to(source/'dist')))==path.read_bytes()
          print(json.dumps({'version':version,'apkSha256':expected,'matchingWebAssets':count,'sourceCommit':'abf3637b6f5a84de605766d6dedb984f87038814'}))
          PY
      - name: Publish without replacing unrelated projects
        working-directory: public
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          names=[]
          for path in Path('../source/dist').rglob('*'):
              if path.is_file() and 'downloads' not in path.relative_to('../source/dist').parts:names.append(str(path.relative_to('../source/dist')))
          for path in Path('../staged').rglob('*'):
              if path.is_file() and not any(part in path.relative_to('../staged').parts for part in ['.git','.release-parts']):names.append(str(path.relative_to('../staged')))
          names.extend(['downloads/1.3.17','downloads/fragment-editor.apk','downloads/fragment-source.zip'])
          subprocess.run(['git','add','--',*names],check=True)
          PY
          if ! git diff --cached --quiet; then git commit -m 'Publish verified Fragment 1.3.17: editing tools, SVG and release evidence'; fi
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
          git show -s --format='PUBLICATION_COMMIT=%H%nPUBLICATION_TREE=%T'
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds --jq '{status,commit}'
