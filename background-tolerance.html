<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Допуск цвета фона — рабочий пример</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px system-ui}nav{height:46px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#edf5ff}a{color:#0759ae}iframe{display:block;width:100%;height:calc(100% - 46px);border:0}#error{position:fixed;top:46px;background:white;color:#a00;padding:20px}</style><nav><b>Допуск фона:</b><a href="?t=15">15</a><a href="?t=55">55</a><a href="?t=160">160</a><span id="state">Загрузка…</span></nav><iframe id="editor" title="Рабочий редактор" src="editor.html?v=tolerance-demo-1"></iframe><script>
const tolerance=['15','55','160'].includes(new URLSearchParams(location.search).get('t'))?new URLSearchParams(location.search).get('t'):'160';
document.getElementById('editor').addEventListener('load',async function(){try{const w=this.contentWindow,d=w.document;const image=await w.loadImg('examples/background-tolerance/logo.svg');w.applySource(image,'Пример: четыре полосы на белом фоне',false);w.setMode('move');d.getElementById('splitTolerance').value='100';d.getElementById('backgroundTolerance').value=tolerance;d.getElementById('backgroundTolerance').dispatchEvent(new w.Event('input',{bubbles:true}));document.getElementById('state').textContent='Допуск '+tolerance+' · чувствительность 100 · нажмите «Автоматически разделить объекты»';}catch(e){document.getElementById('state').textContent='Ошибка: '+e.message}});
</script></html>
