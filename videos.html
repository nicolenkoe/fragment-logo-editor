<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Видеоинструкции — Фрагмент</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{height:100dvh;background:#eef1e8;color:#293b23;font:14px system-ui;display:flex;flex-direction:column;padding:16px;gap:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:20px}a{color:#425e22}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #d6dfc7;background:white;padding:9px 14px;border-radius:8px;cursor:pointer}button[aria-selected=true]{background:#d9f27c}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#172110;border-radius:12px}video{display:block;width:100%;height:100%;max-height:100%;object-fit:contain}footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;color:#6e7e5b}#description{margin:0;font-size:12px;color:#728161}@media(max-width:500px){body{padding:10px;gap:9px}h1{font-size:16px}button{font-size:12px;padding:8px}header a{font-size:12px}}</style></head><body><header><h1>Видеоинструкции</h1><a href="editor.html">← В редактор</a></header><nav role="tablist" aria-label="Выбор видео"><button id="quick" role="tab" aria-selected="true">Быстрый старт · ≈ 2 мин</button><button id="overview" role="tab" aria-selected="false">Полный обзор</button><button id="checks" role="tab" aria-selected="false">Что проверить · 1.2</button></nav><p id="description">Запись работы текущего редактора: весь интерфейс, курсор и реальные действия. С русской озвучкой и субтитрами.</p><main><video id="player" controls playsinline preload="metadata" poster="videos/quick-poster.jpg"><source src="videos/quick.mp4" type="video/mp4"><track id="captions" kind="captions" srclang="ru" label="Русские субтитры" src="videos/quick.vtt"></video></main><footer><a id="downloadVideo" href="videos/quick.mp4" download>Скачать видео MP4</a><a id="transcript" href="videos/quick-transcript.txt" download>Текст инструкции</a><span>Запись реального интерфейса</span></footer><script>const player=document.getElementById('player');function choose(kind){if(!['quick','overview','checks'].includes(kind))kind='quick';for(const id of ['quick','overview','checks'])document.getElementById(id).setAttribute('aria-selected',String(id===kind));player.pause();player.src='videos/'+kind+'.mp4?v=1.2';player.poster='videos/'+kind+'-poster.jpg';document.getElementById('captions').src='videos/'+kind+'.vtt?v=1.2';document.getElementById('downloadVideo').href='videos/'+kind+'.mp4?v=1.2';document.getElementById('transcript').href='videos/'+kind+'-transcript.txt';history.replaceState(null,'','?video='+kind)}document.getElementById('quick').onclick=()=>choose('quick');document.getElementById('overview').onclick=()=>choose('overview');choose(new URLSearchParams(location.search).get('video')||'quick');</script></body></html>
