<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastercard — Фрагмент, редактор</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}#error{position:fixed;top:0;background:white;color:#a00;padding:20px}</style><iframe id="editor" title="Редактор Mastercard" src="editor.html?v=mastercard-1"></iframe><script>
document.getElementById('editor').addEventListener('load',async function(){try{const w=this.contentWindow,d=w.document;const response=await fetch('examples/logo-split/mastercard-source.png');if(!response.ok)throw Error('Не удалось загрузить логотип');const file=new w.File([await response.blob()],'mastercard.png',{type:'image/png'}),dt=new w.DataTransfer();dt.items.add(file);d.getElementById('file').files=dt.files;await d.getElementById('file').onchange({target:d.getElementById('file')});const slider=d.getElementById('splitTolerance');slider.value='100';slider.dispatchEvent(new w.Event('input',{bubbles:true}));d.getElementById('split').click();}catch(e){const p=document.createElement('p');p.id='error';p.textContent='Не удалось открыть пример: '+e.message;document.body.append(p)}});
</script></html>
